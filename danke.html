<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Vielen Dank | Lenson Consulting</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .danke-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #0B0B0B 0%, #111111 40%, #0D0D0D 70%, #0B0B0B 100%);
            position: relative;
            overflow: hidden;
            padding: 40px 0;
        }

        .danke-section::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(198,168,107,0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .danke-content {
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 0 20px;
            max-width: 600px;
        }

        .danke-icon {
            font-size: 5rem;
            margin-bottom: 24px;
            animation: dankePop 0.6s ease;
        }

        @keyframes dankePop {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .danke-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #C6A86B;
            border: 1px solid #C6A86B;
            padding: 8px 16px;
            border-radius: 2px;
            margin-bottom: 24px;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        .danke-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 16px;
            animation: fadeInUp 0.8s ease 0.5s both;
        }

        .danke-title span {
            font-family: 'Alex Brush', 'Playfair Display', Georgia, cursive;
            font-size: 1.4em;
            font-weight: 400;
            color: #C6A86B;
            display: inline;
            vertical-align: -4px;
        }

        .danke-text {
            font-size: 1.1rem;
            color: #9CA3AF;
            font-weight: 300;
            line-height: 1.8;
            margin-bottom: 36px;
            animation: fadeInUp 0.8s ease 0.7s both;
        }

        .danke-info {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease 0.9s both;
        }

        .danke-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #9CA3AF;
        }

        .danke-info-item i {
            color: #C6A86B;
        }

        .danke-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease 1.1s both;
        }

        .btn-gold {
            background: #C6A86B;
            color: #0B0B0B !important;
            border: none;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 2px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-gold:hover {
            background: #D4B87A;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(198,168,107,0.3);
            color: #0B0B0B !important;
        }

        .btn-outline-light {
            border: 1px solid rgba(255,255,255,0.4);
            color: #FFFFFF !important;
            background: transparent;
            padding: 14px 32px;
            border-radius: 2px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline-light:hover {
            background: rgba(255,255,255,0.1);
            border-color: #FFFFFF;
            color: #FFFFFF !important;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-to-home {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #000;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            background: transparent;
            border: 2px solid #C6A86B;
            border-radius: 30px;
            padding: 6px 16px;
            transition: all 0.3s ease;
        }

        .back-to-home:hover {
            color: #C6A86B;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(198,168,107,0.2);
        }

        .back-to-home i {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Zurück-Button -->
    <a href="index.html" class="back-to-home" title="Zurück zur Startseite">
        <i class="bi bi-arrow-left"></i> <span>zurück</span>
    </a>

    <!-- Danke-Section -->
    <section class="danke-section">
        <div class="danke-content">
            <div class="danke-icon">🍽️</div>
            <span class="danke-badge">Anfrage gesendet</span>
            <h1 class="danke-title">
                <span>V</span>ielen Dank!
            </h1>
            <p class="danke-text">
                Ihre Anfrage ist erfolgreich bei mir eingegangen.<br>
                Ich melde mich innerhalb von <strong style="color:#C6A86B;">24 Stunden</strong> persönlich bei Ihnen.
            </p>
            <div class="danke-info">
                <div class="danke-info-item">
                    <i class="bi bi-check-circle-fill"></i>
                    <span>Bestätigung per E-Mail</span>
                </div>
                <div class="danke-info-item">
                    <i class="bi bi-clock"></i>
                    <span>Antwort innerhalb 24h</span>
                </div>
            </div>
            <div class="danke-buttons">
                <a href="index.html#portfolio" class="btn btn-gold">
                    <i class="bi bi-eye"></i> Demos ansehen
                </a>
                <a href="index.html" class="btn btn-outline-light">
                    <i class="bi bi-house"></i> Zur Startseite
                </a>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
